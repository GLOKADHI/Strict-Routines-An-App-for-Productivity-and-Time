name: Deploy product showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and validate public showcase
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
        run: python scripts/build_pages.py --site-url "$SITE_URL"
      - name: Validate JavaScript syntax
        run: node --check assets/site/app.js
      - name: Upload public website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
