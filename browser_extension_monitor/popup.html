<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StrictRoutines monitoring status</title><link rel="stylesheet" href="ui.css"></head><body class="helper"><p class="eyebrow">StrictRoutines</p><h1>Monitoring status</h1><p class="muted">Checks this companion in this browser profile. Your desktop keeps any active deadline.</p><div class="card-box"><p id="status" role="status">Waiting for a confirmed report.</p><p id="countdown" role="status"></p><p id="deadline" class="note"></p><p id="checked" class="note"></p></div><button id="restore">Open extension manager</button><details class="advanced"><summary>Grace-period settings</summary><label for="grace">Grace period for a new interruption</label><select id="grace"><option value="5">5 minutes</option><option value="7">7 minutes</option><option value="10">10 minutes</option></select><button id="save">Save grace period</button><p id="result" role="status"></p></details><small>Unknown monitoring time adds no penalties. Pending points change only after your Android ledger confirms them.</small><script src="setup-config.js"></script><script src="popup.js"></script></body></html>
