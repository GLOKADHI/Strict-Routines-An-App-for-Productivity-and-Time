[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-language-v1"
version = "0.1.0"
description = "A small image-understanding API with a browser UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pillow>=10.4,<12.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
native = [
    "numpy>=2.2",
    "torch>=2.5",
]
automation = [
    "pynput>=1.7,<2.0",
    "pytesseract>=0.3.13,<1.0",
]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools]
py-modules = ["bounded_multipart", "local_api_security", "local_image_paths", "run_local"]

[tool.setuptools.packages.find]
include = ["app*", "training*", "winassist_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
